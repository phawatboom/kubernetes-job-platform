apiVersion: v1
kind: ConfigMap
metadata: {name: application, namespace: dispatch}
data:
  APP_REVISION: v1
  WORKER_IMAGE: dispatch-lab:v1
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dispatch}
spec:
  replicas: 2
  minReadySeconds: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: dispatcher
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: dispatch-lab:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - {secretRef: {name: database}}
            - {configMapRef: {name: application}}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: dispatch}
spec:
  type: NodePort
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: dispatch}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api}
