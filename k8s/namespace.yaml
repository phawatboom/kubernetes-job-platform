apiVersion: v1
kind: Namespace
metadata:
  name: dispatch
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: lab-budget, namespace: dispatch}
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    pods: "20"
    count/jobs.batch: "12"
    requests.storage: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-defaults, namespace: dispatch}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 64Mi}
      default: {cpu: 500m, memory: 256Mi}
